<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="vyd-play-grad" x1="15%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FF3B8A" />
      <stop offset="45%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="vyd-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <filter id="vyd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Ring -->
  <ellipse cx="26" cy="36" rx="22" ry="12" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3" transform="rotate(-15 26 36)" />
  
  <!-- Play Icon -->
  <g filter="url(#vyd-glow)">
    <path d="M16 14.5 C16 12.2 18.5 10.8 20.4 12.0 L39.2 24.3 C41.0 25.5 41.0 28.2 39.2 29.4 L20.4 41.7 C18.5 42.9 16 41.5 16 39.2 Z" 
          fill="url(#vyd-play-grad)" />
  </g>

  <!-- Sparkle Star in top right -->
  <path d="M42 12 Q42 16 46 16 Q42 16 42 20 Q42 16 38 16 Q42 16 42 12 Z" fill="#E0E7FF" filter="drop-shadow(0 0 4px #C084FC)" />
  <circle cx="42" cy="16" r="1.2" fill="#FFFFFF" />

  <!-- Brand Typography VYDEORA -->
  <text x="56" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">VYDEORA</text>
</svg>
